<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    
    <!-- FORMULARIOS -->
    <h1>REGISTRO</h1>
    <form>
        <div>
            <!-- Label se usa para describir que debe ingresarse en un campo -->
            <label for="fullname">Nombre Completo:</label>
            <input type="text" id="fullname" placeholder="Michael Jackson">
        </div>
        <div>
            <label for="email">Ingresa tu correo electronico:</label>
            <input type="email" id="email" placeholder="ayuwoki@gmail.com">
        </div>
        <div>
            <label for="pais">Selecciona tu pais:</label>
            <select id="pais">
                <option value="AR">Argentina</option>
                <option value="CO">Colombia</option>
                <option value="CL">Chile</option>
                <option value="BR">Brasil</option>
                <option value="VNZ">Venezuela</option>
                <option value="0" selected disabled>No seleccionado</option>
            </select>
        </div>
        <div>
            <label for="description">Ingrese una descripcion:</label>
            <textarea id="description" rows="10" cols="6"></textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
